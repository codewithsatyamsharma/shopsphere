name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (root, backend and frontend)
        run: npm install

      - name: Run backend and frontend tests
        run: npm test

      - name: Build the frontend
        run: npm run build
